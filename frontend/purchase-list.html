<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase List - ErpBuddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Navigation */
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 1.5rem;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .navbar-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .user-info {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h2 {
            font-size: 1.8rem;
            color: #333;
        }

        .header-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Action buttons */
        .btn {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Messages */
        .message {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .message.show {
            display: flex;
        }

        #errorMessage {
            background-color: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
            border-left: 4px solid #f44336;
        }

        #successMessage {
            background-color: #e8f5e9;
            border: 1px solid #81c784;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }

        #loadingMessage {
            background-color: #e3f2fd;
            border: 1px solid #64b5f6;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .message-content {
            flex: 1;
        }

        /* Loading spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #fafafa;
        }

        /* Row actions */
        .row-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .empty-state small {
            display: block;
            color: #bbb;
        }

        /* Role-based visibility */
        [data-role="admin-only"] {
            display: none;
        }

        body.admin [data-role="admin-only"],
        body.admin [data-role="admin"] {
            display: inline-flex;
        }

        body.staff [data-role="staff"] {
            display: inline-flex;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                padding: 1rem;
            }

            th, td {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .navbar {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .navbar-right {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* Modal (for future use) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-footer {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Status badge */
        .badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge-pending {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-confirmed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-invoiced {
            background: #e3f2fd;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="navbar">
        <h1>ErpBuddy</h1>
        <div class="navbar-right">
            <div class="user-info">
                <span id="userName">User</span> 
                <span id="userRole" style="opacity: 0.7;">-</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Messages -->
        <div id="errorMessage" class="message">
            <div class="message-content"></div>
        </div>
        <div id="successMessage" class="message">
            <div class="message-content"></div>
        </div>
        <div id="loadingMessage" class="message">
            <div class="spinner"></div>
            <div class="message-content">Loading...</div>
        </div>

                <!-- Header -->
        <div class="header">
            <h2>Purchases</h2>
            <div class="header-buttons">
                <button class="btn btn-secondary" onclick="goToDashboard()">
                    ← Back to Dashboard
                </button>
                <button id="createBtn" class="btn btn-primary" data-role="admin-only" onclick="createPurchase()">
                    ➕ New Purchase
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table id="purchaseTable">
                <thead>
                    <tr>
                        <th>Purchase ID</th>
                        <th>Date</th>
                        <th>Vendor</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th data-role="admin-only">Actions</th>
                    </tr>
                </thead>
                <tbody id="purchaseBody">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <p>No purchases found</p>
                            <small>Create your first purchase to get started</small>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts (in order) -->
    <script src="js/auth.js"></script>
    <script src="js/protect.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            // Protect page from unauthorized access
            initializePageProtection();

            // Display user info
            displayUserInfo();

            // Apply role-based UI
            applyRoleBasedVisibility();

            // Load purchases
            await loadPurchases();
        });

        /**
         * Display user information in navbar
         */
        function displayUserInfo() {
            const userData = getUserData();
            if (userData) {
                document.getElementById('userName').textContent = userData.email || 'User';
                document.getElementById('userRole').textContent = userData.userRole || 'unknown';
            }
        }

        /**
         * Load purchases from API
         */
        async function loadPurchases() {
            try {
                clearError('errorMessage');
                showLoadingMessage();

                const response = await apiGet('/purchase');
                console.log("Purchase Data:", response);
                hideLoadingMessage();

                // Handle different response formats
                const purchasesData = response.data || response;
                
                if (!purchasesData || (Array.isArray(purchasesData) && purchasesData.length === 0)) {
                    renderEmptyState();
                    return;
                }

                renderPurchaseTable(Array.isArray(purchasesData) ? purchasesData : []);
            } catch (error) {
                hideLoadingMessage();
                console.error("Error loading purchases:", error);
                handleApiError(error, 'errorMessage');
                renderEmptyState();
            }
        }

        /**
         * Render purchase table with data
         */
        function renderPurchaseTable(purchases) {
            const tbody = document.getElementById('purchaseBody');
            tbody.innerHTML = purchases.map(purchase => `
                <tr>
                    <td><strong>${purchase.purchaseNumber || 'N/A'}</strong></td>
                    <td>${formatDate(purchase.createdAt)}</td>
                    <td>${purchase.vendorName || purchase.vendorId || 'N/A'}</td>
                    <td style="text-align: right;">
                        <strong>₹${parseFloat(purchase.totalAmount || 0).toFixed(2)}</strong>
                    </td>
                    <td>
                        <span class="badge badge-${getStatusClass(purchase.status)}">
                            ${capitalizeFirst(purchase.status || 'pending')}
                        </span>
                    </td>
                    <td>
                        <div class="row-actions">
                            <button class="btn btn-secondary btn-small" onclick="viewJournal('${purchase._id}')">
                                📔 View Journal
                            </button>
                            <button class="btn btn-secondary btn-small" onclick="editPurchase('${purchase._id}')" data-role="admin-only">
                                Edit
                            </button>
                            <button class="btn btn-danger btn-small" onclick="deletePurchase('${purchase._id}', '${purchase.purchaseNumber}')" data-role="admin-only">
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        /**
         * Render empty state
         */
        function renderEmptyState() {
            const tbody = document.getElementById('purchaseBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        <p>No purchases found</p>
                        <small>Create your first purchase to get started</small>
                    </td>
                </tr>
            `;
        }

        /**
         * Format date for display
         */
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        /**
         * Get CSS class for status badge
         */
        function getStatusClass(status) {
            const statusMap = {
                'pending': 'pending',
                'confirmed': 'confirmed',
                'received': 'confirmed',
                'invoiced': 'invoiced',
                'cancelled': 'pending'
            };
            return statusMap[status?.toLowerCase()] || 'pending';
        }

        /**
         * Capitalize first letter
         */
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        /**
         * Show loading message
         */
        function showLoadingMessage() {
            const container = document.getElementById('loadingMessage');
            container.classList.add('show');
        }

        /**
         * Hide loading message
         */
        function hideLoadingMessage() {
            const container = document.getElementById('loadingMessage');
            container.classList.remove('show');
        }

        /**
         * Create new purchase
         */
        function createPurchase() {
            window.location.href = 'purchase-form.html';
        }

        /**
         * Edit purchase
         */
        function editPurchase(purchaseId) {
            window.location.href = `purchase-form.html?id=${purchaseId}`;
        }

        /**
         * View journal entries for a purchase
         */
        function viewJournal(purchaseId) {
            window.location.href = `journal.html?purchaseId=${purchaseId}`;
        }

        /**
         * Delete purchase
         */
        async function deletePurchase(purchaseId, purchaseNumber) {
            if (!confirm(`Are you sure you want to delete purchase ${purchaseNumber}?`)) {
                return;
            }

            try {
                clearError('errorMessage');
                showLoadingMessage();

                await apiDelete(`/purchase/${purchaseId}`);
                hideLoadingMessage();

                showSuccessMessage(`Purchase ${purchaseNumber} deleted successfully`, 'successMessage');
                await loadPurchases();
            } catch (error) {
                hideLoadingMessage();
                handleApiError(error, 'errorMessage');
            }
        }

        /**
         * Go back to dashboard
         */
        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
