<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Invoice - ErpBuddy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: #667eea; padding: 1rem; color: white; display: flex; justify-content: space-between; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 1.5rem; color: #333; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 500; margin-bottom: 0.5rem; color: #555; }
        input, select { padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; margin-left: 0.5rem; }
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
        .table th { background: #f5f5f5; font-weight: 600; color: #555; }
        .message { padding: 1rem; border-radius: 4px; margin-bottom: 1rem; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .stock-info { font-size: 0.9rem; color: #666; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>ErpBuddy - Sales Invoice</h1>
        <div>
            <button class="btn btn-secondary" onclick="goToDashboard()">Dashboard</button>
            <button class="btn btn-secondary" onclick="goToPurchases()">Purchases</button>
        </div>
    </div>

    <div class="container">
        <div id="errorMessage" class="message error"></div>
        <div id="successMessage" class="message success"></div>

        <div class="card">
            <h2>New Sales Invoice</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name *</label>
                    <input type="text" id="customerName" placeholder="Enter customer name">
                </div>
                <div class="form-group">
                    <label>Sales Date *</label>
                    <input type="date" id="salesDate" required>
                </div>
            </div>

            <h3 style="margin-top: 2rem;">Sales Items</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
            </table>
            <button class="btn btn-primary" onclick="addItemRow()" style="margin-top: 1rem;">+ Add Item</button>

            <div style="margin-top: 2rem; padding: 1.5rem; background: #f9f9f9; border-radius: 4px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">Total Amount</h3>
                    <div style="font-size: 1.5rem; font-weight: bold; color: #2e7d32;">
                        ₹<span id="grandTotal">0.00</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button class="btn btn-secondary" onclick="goBack()">Cancel</button>
                <button class="btn btn-primary" onclick="submitSales()">Save Sales</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let itemCount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('salesDate').valueAsDate = new Date();
            addItemRow();
        });

        function addItemRow() {
            const tbody = document.getElementById('itemsBody');
            const rowId = `item-${itemCount++}`;

            const row = document.createElement('tr');
            row.id = rowId;
            row.innerHTML = `
                <td>
                    <select class="item-id" style="width: 100%; padding: 0.5rem;" onchange="updateItemStockInfo(this)">
                        <option value="">Select Item</option>
                    </select>
                    <div class="stock-info" id="stock-${rowId}"></div>
                    <input type="hidden" class="item-name">
                </td>
                <td>
                    <input type="number" class="item-qty" style="width: 100%; padding: 0.5rem;" 
                           placeholder="0" min="1" step="1" oninput="calculateRowTotal(this)">
                </td>
                <td>
                    <input type="number" class="item-rate" style="width: 100%; padding: 0.5rem;" 
                           placeholder="0.00" min="0" step="0.01" oninput="calculateRowTotal(this)">
                </td>
                <td>
                    <span class="item-amount">₹0.00</span>
                </td>
                <td>
                    <button class="btn btn-secondary" onclick="removeItemRow('${rowId}')">Remove</button>
                </td>
            `;

            tbody.appendChild(row);
            loadItemsDropdown(row.querySelector('.item-id'));
        }

        async function loadItemsDropdown(selectElement) {
            try {
                const response = await apiGet('/items/simple');
                const items = response.data || [];
                
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item._id;
                    option.textContent = `${item.name} (Stock: ${item.currentStock})`;
                    option.dataset.name = item.name;
                    option.dataset.stock = item.currentStock;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.log('Failed to load items:', error.message);
            }
        }

        function updateItemStockInfo(selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const stock = selectedOption.dataset.stock || 0;
            const itemName = selectedOption.dataset.name || '';
            
            const rowId = selectElement.closest('tr').id;
            const stockInfo = document.getElementById(`stock-${rowId}`);
            stockInfo.textContent = `Available: ${stock}`;
            
            selectElement.parentElement.querySelector('.item-name').value = itemName;
            calculateRowTotal(selectElement);
        }

        function calculateRowTotal(inputElement) {
            const row = inputElement.closest('tr');
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const amount = qty * rate;
            
            row.querySelector('.item-amount').textContent = `₹${amount.toFixed(2)}`;
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let total = 0;
            document.querySelectorAll('#itemsBody tr').forEach(row => {
                const amountText = row.querySelector('.item-amount').textContent;
                const amount = parseFloat(amountText.replace('₹', '')) || 0;
                total += amount;
            });
            document.getElementById('grandTotal').textContent = total.toFixed(2);
        }

        function removeItemRow(rowId) {
            const row = document.getElementById(rowId);
            if (row && document.querySelectorAll('#itemsBody tr').length > 1) {
                row.remove();
                calculateGrandTotal();
            }
        }

        async function submitSales() {
            const customerName = document.getElementById('customerName').value.trim();
            const salesDate = document.getElementById('salesDate').value;
            
            if (!customerName) {
                showError('Customer name is required');
                return;
            }
            if (!salesDate) {
                showError('Sales date is required');
                return;
            }

            const items = [];
            let hasValidItem = false;
            
            document.querySelectorAll('#itemsBody tr').forEach(row => {
                const itemId = row.querySelector('.item-id').value;
                const itemName = row.querySelector('.item-name').value;
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                
                if (itemId && qty > 0 && rate > 0) {
                    items.push({
                        itemId,
                        itemName,
                        quantity: qty,
                        rate: rate,
                        amount: qty * rate
                    });
                    hasValidItem = true;
                }
            });

            if (!hasValidItem) {
                showError('At least one valid item is required');
                return;
            }

            const totalAmount = parseFloat(document.getElementById('grandTotal').textContent);

            try {
                const response = await apiPost('/sales/simple', {
                    customerName,
                    date: salesDate,
                    items,
                    totalAmount
                });

                showSuccess('Sales invoice created successfully');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                showError('Failed to create sales: ' + error.message);
            }
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
        }

        function goBack() {
            window.location.href = 'dashboard.html';
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        function goToPurchases() {
            window.location.href = 'purchase-list.html';
        }
    </script>
</body>
</html>
