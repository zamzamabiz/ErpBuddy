<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial Balance - ERP Buddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">Trial Balance</h1>
        <nav>
          <a href="dashboard.html" class="mr-4 hover:underline">Dashboard</a>
          <a href="ledger.html" class="mr-4 hover:underline">Ledger</a>
          <a href="trial-balance.html" class="mr-4 hover:underline">Trial Balance</a>
          <a href="profit-loss.html" class="mr-4 hover:underline">P&L</a>
          <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-6">
      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="mt-2 text-gray-600">Loading...</p>
      </div>

      <!-- Controls -->
      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex gap-4 items-end">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">As of Date</label>
            <input type="date" id="asOfDate" class="w-full border rounded p-2">
          </div>
          <button onclick="loadTrialBalance()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Load Trial Balance
          </button>
          <button onclick="validateTrialBalance()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
            Validate
          </button>
          <button onclick="exportTrialBalance()" id="exportBtn" class="hidden bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700">
            Export CSV
          </button>
        </div>
      </div>

      <!-- Validation Status -->
      <div id="validationStatus" class="hidden mb-6 p-4 rounded-lg">
        <p class="text-lg font-semibold" id="validationText"></p>
      </div>

      <!-- Totals Summary -->
      <div id="totalsSummary" class="hidden bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Summary</h2>
        <div class="grid grid-cols-3 gap-4">
          <div class="bg-blue-50 p-4 rounded">
            <p class="text-sm text-gray-600">Total Debits</p>
            <p class="font-semibold text-xl" id="totalDebits">0.00</p>
          </div>
          <div class="bg-red-50 p-4 rounded">
            <p class="text-sm text-gray-600">Total Credits</p>
            <p class="font-semibold text-xl" id="totalCredits">0.00</p>
          </div>
          <div class="bg-purple-50 p-4 rounded">
            <p class="text-sm text-gray-600">Status</p>
            <p class="font-semibold text-xl" id="balanceStatus">-</p>
          </div>
        </div>
      </div>

      <!-- Trial Balance Table -->
      <div id="trialBalanceTable" class="hidden bg-white rounded-lg shadow overflow-hidden">
        <h2 class="text-xl font-semibold p-6 pb-0">Accounts</h2>
        <table class="w-full mt-4">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Debit</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Credit</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Balance</th>
            </tr>
          </thead>
          <tbody id="trialBalanceEntries" class="divide-y divide-gray-200">
          </tbody>
          <tfoot class="bg-gray-50 font-semibold">
            <tr>
              <td colspan="3" class="px-6 py-4 text-right">TOTALS</td>
              <td class="px-6 py-4 text-right" id="footerDebits">0.00</td>
              <td class="px-6 py-4 text-right" id="footerCredits">0.00</td>
              <td class="px-6 py-4 text-right">-</td>
            </tr>
          </tfoot>
        </table>
        <div id="noEntries" class="hidden p-6 text-center text-gray-500">No accounts found</div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // Current trial balance data for export
    let currentTrialBalanceData = null;

    // Load trial balance
    async function loadTrialBalance() {
      const asOfDate = document.getElementById('asOfDate').value;

      // Clear previous errors
      document.getElementById('errorMessage').classList.add('hidden');

      Layout.showLoading(true);

      try {
        const result = await API.getTrialBalance(asOfDate);

        if (result.success) {
          displayTrialBalance(result.data);
        } else {
          Layout.showError('Error: ' + result.error);
        }
      } catch (error) {
        Layout.showError('Error loading trial balance: ' + error.message);
      } finally {
        Layout.showLoading(false);
      }
    }

    // Validate trial balance
    async function validateTrialBalance() {
      const asOfDate = document.getElementById('asOfDate').value;

      // Clear previous errors
      document.getElementById('errorMessage').classList.add('hidden');

      Layout.showLoading(true);

      try {
        const result = await API.validateTrialBalance(asOfDate);

        if (result.success) {
          displayValidation(result.data);
        } else {
          Layout.showError('Error: ' + result.error);
        }
      } catch (error) {
        Layout.showError('Error validating trial balance: ' + error.message);
      } finally {
        Layout.showLoading(false);
      }
    }

    // Display validation
    function displayValidation(data) {
      const statusDiv = document.getElementById('validationStatus');
      const statusText = document.getElementById('validationText');
      
      statusDiv.classList.remove('hidden');
      
      if (data.isValid) {
        statusDiv.className = 'mb-6 p-4 rounded-lg bg-green-100 border border-green-400 text-green-700';
        statusText.textContent = `✅ Trial Balance is BALANCED! Total Debits: ${Layout.formatCurrency(data.totalDebits)} = Total Credits: ${Layout.formatCurrency(data.totalCredits)}`;
      } else {
        statusDiv.className = 'mb-6 p-4 rounded-lg bg-red-100 border border-red-400 text-red-700';
        statusText.textContent = `❌ Trial Balance is NOT BALANCED! Discrepancy: ${Layout.formatCurrency(data.discrepancy)}`;
      }
    }

    // Display trial balance
    function displayTrialBalance(data) {
      currentTrialBalanceData = data;

      // Hide validation status when loading new data
      document.getElementById('validationStatus').classList.add('hidden');

      // Show totals
      document.getElementById('totalsSummary').classList.remove('hidden');
      document.getElementById('totalDebits').textContent = Layout.formatCurrency(data.totalDebits);
      document.getElementById('totalCredits').textContent = Layout.formatCurrency(data.totalCredits);
      
      const statusEl = document.getElementById('balanceStatus');
      if (data.isBalanced) {
        statusEl.textContent = '✅ Balanced';
        statusEl.className = 'font-semibold text-xl text-green-600';
      } else {
        statusEl.textContent = '❌ Not Balanced';
        statusEl.className = 'font-semibold text-xl text-red-600';
      }

      // Show table
      document.getElementById('trialBalanceTable').classList.remove('hidden');
      const tbody = document.getElementById('trialBalanceEntries');
      tbody.innerHTML = '';

      if (data.accounts.length === 0) {
        document.getElementById('noEntries').classList.remove('hidden');
        document.getElementById('exportBtn').classList.add('hidden');
      } else {
        document.getElementById('noEntries').classList.add('hidden');
        document.getElementById('exportBtn').classList.remove('hidden');
        
        data.accounts.forEach(account => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap font-mono">${account.account.code}</td>
            <td class="px-6 py-4 whitespace-nowrap">${account.account.name}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 py-1 text-xs rounded ${getTypeBadgeClass(account.account.type)}">
                ${account.account.type}
              </span>
            </td>
            <td class="px-6 py-4 text-right">${Layout.formatCurrency(account.debit)}</td>
            <td class="px-6 py-4 text-right">${Layout.formatCurrency(account.credit)}</td>
            <td class="px-6 py-4 text-right font-semibold">${Layout.formatCurrency(account.balance)}</td>
          `;
          tbody.appendChild(tr);
        });

        // Update footer
        document.getElementById('footerDebits').textContent = Layout.formatCurrency(data.totalDebits);
        document.getElementById('footerCredits').textContent = Layout.formatCurrency(data.totalCredits);
      }
    }

    // Get badge class for account type
    function getTypeBadgeClass(type) {
      const classes = {
        'ASSET': 'bg-blue-100 text-blue-800',
        'LIABILITY': 'bg-red-100 text-red-800',
        'EQUITY': 'bg-purple-100 text-purple-800',
        'INCOME': 'bg-green-100 text-green-800',
        'EXPENSE': 'bg-yellow-100 text-yellow-800'
      };
      return classes[type] || 'bg-gray-100 text-gray-800';
    }

    // Export trial balance to CSV
    function exportTrialBalance() {
      if (!currentTrialBalanceData || !currentTrialBalanceData.accounts || currentTrialBalanceData.accounts.length === 0) {
        Layout.showError('No data to export');
        return;
      }

      const columns = [
        { header: 'Code', key: 'code' },
        { header: 'Account Name', key: 'name' },
        { header: 'Type', key: 'type' },
        { header: 'Debit', key: 'debit' },
        { header: 'Credit', key: 'credit' },
        { header: 'Balance', key: 'balance' }
      ];

      // Format data for export
      const exportData = currentTrialBalanceData.accounts.map(account => ({
        code: account.account.code,
        name: account.account.name,
        type: account.account.type,
        debit: account.debit || 0,
        credit: account.credit || 0,
        balance: account.balance || 0
      }));

      Layout.exportToCSVCustom(exportData, columns, 'Trial_Balance');
    }

    // Set default date to today
    document.getElementById('asOfDate').valueAsDate = new Date();
  </script>
</body>
</html>
