<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger - ERP Buddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">Ledger</h1>
        <nav>
          <a href="dashboard.html" class="mr-4 hover:underline">Dashboard</a>
          <a href="ledger.html" class="mr-4 hover:underline">Ledger</a>
          <a href="trial-balance.html" class="mr-4 hover:underline">Trial Balance</a>
          <a href="profit-loss.html" class="mr-4 hover:underline">P&L</a>
          <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-6">
      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="mt-2 text-gray-600">Loading...</p>
      </div>

      <!-- Account Selection -->
      <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Select Account</h2>
        <div class="flex gap-4 items-end">
          <select id="accountSelect" class="flex-1 border rounded p-2">
            <option value="">-- Select Account --</option>
          </select>
          <div class="flex gap-2">
            <div>
              <label class="block text-xs text-gray-500 mb-1">From</label>
              <input type="date" id="fromDate" class="border rounded p-2">
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1">To</label>
              <input type="date" id="toDate" class="border rounded p-2">
            </div>
          </div>
          <button onclick="loadLedger()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Load Ledger
          </button>
          <button onclick="exportLedger()" id="exportBtn" class="hidden bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">
            Export CSV
          </button>
        </div>
      </div>

      <!-- Ledger Summary -->
      <div id="ledgerSummary" class="hidden bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Account Summary</h2>
        <div class="grid grid-cols-4 gap-4">
          <div class="bg-blue-50 p-4 rounded">
            <p class="text-sm text-gray-600">Account</p>
            <p class="font-semibold" id="accountName">-</p>
          </div>
          <div class="bg-green-50 p-4 rounded">
            <p class="text-sm text-gray-600">Opening Balance</p>
            <p class="font-semibold" id="openingBalance">0.00</p>
          </div>
          <div class="bg-yellow-50 p-4 rounded">
            <p class="text-sm text-gray-600">Total Debit</p>
            <p class="font-semibold" id="totalDebit">0.00</p>
          </div>
          <div class="bg-red-50 p-4 rounded">
            <p class="text-sm text-gray-600">Total Credit</p>
            <p class="font-semibold" id="totalCredit">0.00</p>
          </div>
        </div>
        <div class="mt-4 bg-purple-50 p-4 rounded">
          <p class="text-sm text-gray-600">Closing Balance</p>
          <p class="font-semibold text-xl" id="closingBalance">0.00</p>
        </div>
      </div>

      <!-- Ledger Entries Table -->
      <div id="ledgerTable" class="hidden bg-white rounded-lg shadow overflow-hidden">
        <h2 class="text-xl font-semibold p-6 pb-0">Transactions</h2>
        <table class="w-full mt-4">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reference</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Debit</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Credit</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Balance</th>
            </tr>
          </thead>
          <tbody id="ledgerEntries" class="divide-y divide-gray-200">
          </tbody>
        </table>
        <div id="noEntries" class="hidden p-6 text-center text-gray-500">No transactions found for the selected period</div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // Current ledger data for export
    let currentLedgerData = null;

    // Load accounts into dropdown
    async function loadAccounts() {
      try {
        const result = await API.getAccounts();
        
        if (result.success) {
          const select = document.getElementById('accountSelect');
          select.innerHTML = '<option value="">-- Select Account --</option>';
          
          result.data.forEach(account => {
            if (account.allowPosting) {
              const option = document.createElement('option');
              option.value = account._id;
              option.textContent = `${account.code} - ${account.name}`;
              select.appendChild(option);
            }
          });
        } else {
          Layout.showError('Failed to load accounts: ' + result.error);
        }
      } catch (error) {
        Layout.showError('Error loading accounts: ' + error.message);
      }
    }

    // Validate dates
    function validateDates() {
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;

      if (fromDate && toDate && new Date(fromDate) > new Date(toDate)) {
        Layout.showError('From date cannot be after to date');
        return false;
      }
      return true;
    }

    // Load ledger
    async function loadLedger() {
      const accountId = document.getElementById('accountSelect').value;
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;

      // Clear previous errors
      document.getElementById('errorMessage').classList.add('hidden');

      if (!accountId) {
        Layout.showError('Please select an account');
        return;
      }

      if (!validateDates()) {
        return;
      }

      Layout.showLoading(true);

      try {
        const result = await API.getLedger(accountId, fromDate, toDate);

        if (result.success) {
          displayLedger(result.data);
        } else {
          Layout.showError('Error: ' + result.error);
        }
      } catch (error) {
        Layout.showError('Error loading ledger: ' + error.message);
      } finally {
        Layout.showLoading(false);
      }
    }

    // Display ledger data
    function displayLedger(data) {
      currentLedgerData = data;

      // Show summary
      document.getElementById('ledgerSummary').classList.remove('hidden');
      document.getElementById('accountName').textContent = `${data.account.code} - ${data.account.name}`;
      document.getElementById('openingBalance').textContent = Layout.formatCurrency(data.openingBalance);
      document.getElementById('totalDebit').textContent = Layout.formatCurrency(data.totalDebit);
      document.getElementById('totalCredit').textContent = Layout.formatCurrency(data.totalCredit);
      document.getElementById('closingBalance').textContent = Layout.formatCurrency(data.closingBalance);

      // Show table
      document.getElementById('ledgerTable').classList.remove('hidden');
      const tbody = document.getElementById('ledgerEntries');
      tbody.innerHTML = '';

      if (data.entries.length === 0) {
        document.getElementById('noEntries').classList.remove('hidden');
        document.getElementById('exportBtn').classList.add('hidden');
      } else {
        document.getElementById('noEntries').classList.add('hidden');
        document.getElementById('exportBtn').classList.remove('hidden');
        
        data.entries.forEach(entry => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap">${Layout.formatDate(entry.date)}</td>
            <td class="px-6 py-4 whitespace-nowrap">${entry.reference || '-'}</td>
            <td class="px-6 py-4">${entry.description || '-'}</td>
            <td class="px-6 py-4 text-right">${Layout.formatCurrency(entry.debit)}</td>
            <td class="px-6 py-4 text-right">${Layout.formatCurrency(entry.credit)}</td>
            <td class="px-6 py-4 text-right font-semibold">${Layout.formatCurrency(entry.balance)}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    // Export ledger to CSV
    function exportLedger() {
      if (!currentLedgerData || !currentLedgerData.entries || currentLedgerData.entries.length === 0) {
        Layout.showError('No data to export');
        return;
      }

      const columns = [
        { header: 'Date', key: 'date' },
        { header: 'Reference', key: 'reference' },
        { header: 'Description', key: 'description' },
        { header: 'Debit', key: 'debit' },
        { header: 'Credit', key: 'credit' },
        { header: 'Balance', key: 'balance' }
      ];

      // Format data for export
      const exportData = currentLedgerData.entries.map(entry => ({
        date: Layout.formatDate(entry.date),
        reference: entry.reference || '',
        description: entry.description || '',
        debit: entry.debit || 0,
        credit: entry.credit || 0,
        balance: entry.balance || 0
      }));

      Layout.exportToCSVCustom(exportData, columns, `Ledger_${currentLedgerData.account.code}_${currentLedgerData.account.name}`);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', loadAccounts);
  </script>
</body>
</html>
